# iOS app (BeeWare Briefcase + Toga). The scanner core comes in via the symlink src/scansnap → ../../src/scansnap.
# Build and install on the iPhone (USB): ./build_ios.sh

[tool.briefcase]
project_name = "ScanSnack"
bundle = "com.elte0"            # + app name → com.elte0.scansnack
version = "0.3.0"
author = "elte0"
author_email = "elte0@posteo.de"
license = "LicenseRef-Proprietary"

[tool.briefcase.app.scansnack]
formal_name = "ScanSnack"
description = "Scan with the ScanSnap iX1500 over Wi-Fi"
icon = "resources/icon"
sources = ["src/scansnack", "src/scansnap"]
requires = ["pillow>=12"]

[tool.briefcase.app.scansnack.iOS]
requires = ["toga-iOS>=0.5", "std-nslog"]

[tool.briefcase.app.scansnack.iOS.info]
NSLocalNetworkUsageDescription = "ScanSnack connects to your scanner in the local network."
# PDFs in "Files" → "On My iPhone" → "ScanSnack"
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
