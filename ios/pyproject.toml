# iOS-App (BeeWare Briefcase + Toga). Der Scanner-Kern kommt per Symlink src/scansnap → ../../src/scansnap.
# Bauen und aufs iPhone (USB) spielen: ./build_ios.sh

[tool.briefcase]
project_name = "ScanSnack"
bundle = "com.elte0"            # + App-Name → com.elte0.scansnack
version = "0.3.0"
author = "elte0"
author_email = "elte0@posteo.de"
license = "LicenseRef-Proprietary"

[tool.briefcase.app.scansnack]
formal_name = "ScanSnack"
description = "Scannen mit dem ScanSnap iX1500 per WLAN"
icon = "resources/icon"
sources = ["src/scansnack", "src/scansnap"]
requires = ["pillow>=12"]

[tool.briefcase.app.scansnack.iOS]
requires = ["toga-iOS>=0.5", "std-nslog"]

[tool.briefcase.app.scansnack.iOS.info]
NSLocalNetworkUsageDescription = "ScanSnack connects to your scanner in the local network."
# PDFs in „Dateien“ → „Auf meinem iPhone“ → „ScanSnack“
UIFileSharingEnabled = true
LSSupportsOpeningDocumentsInPlace = true
