[project]
name = "scansnap-bridge"
version = "0.1.0"
description = "WLAN-Client für den ScanSnap iX1500 (Grundlage für eine eSCL/AirScan-Bridge)"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
scansnap = "scansnap.app.cli:main"
scansnap-app = "scansnap.app.desktop:main"

[project.optional-dependencies]
app = [
    "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "pyinstaller>=6.22.3",
    "ruff>=0.17.3",
    "pyright>=1.1.414",
    "import-linter>=2.15",
    "numpy>=2.4.6",          # nur für pyright: Pillow-Typen verweisen auf numpy.typing
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scansnap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["ios/.briefcase", "ios/build", "ios/.venv", "ios/src/scansnap", "captures", "build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "PERF", "FURB", "PYI", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # deutsche Typografie („“, –, ×)

[tool.ruff.lint.isort]
known-first-party = ["scansnap", "scansnack", "mock_scanner", "helpers"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests", "tools"]
extraPaths = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "scansnap"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Schichten"
type = "layers"
layers = [
    "scansnap.app",
    "scansnap.adapters",
    "scansnap.ports",
    "scansnap.core",
]

[[tool.importlinter.contracts]]
name = "Core/Ports frei von Qt und Netzwerk"
type = "forbidden"
source_modules = ["scansnap.core", "scansnap.ports"]
forbidden_modules = ["PySide6", "PyQt6", "socket"]

[[tool.importlinter.contracts]]
name = "Adapter unabhängig voneinander"
type = "independence"
modules = [
    "scansnap.adapters.ix1500",
    "scansnap.adapters.escl",
    "scansnap.adapters.library",
    "scansnap.adapters.qt",
]
