[project]
name = "scansnap-bridge"
version = "0.1.0"
description = "WLAN-Client für den ScanSnap iX1500 (Grundlage für eine eSCL/AirScan-Bridge)"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
scansnap = "scansnap.cli:main"
scansnap-app = "scansnap.app.main:main"

[project.optional-dependencies]
app = [
    "pyside6>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scansnap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
