# Builds the website (site/ + docs/) with Hugo and publishes it on GitHub Pages.
# On every build: fresh screenshots of the app (tools/screenshots.py) and the downloads of the latest release
# (site/data/release.json from the GitHub API). release.yml restarts this workflow after every release.
# Requirement: Settings → Pages → Source "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - docs/protocol.md
      - docs/airscan.md
      - docs/disclaimer.md
      - CHANGELOG.md
      - site/**
      - src/scansnap/adapters/qt/**   # UI → screenshots
      - src/scansnap/core/**
      - tools/screenshots.py
      - .github/workflows/pages.yml
  # on pull requests only build (checks layout and mounts), do not publish
  pull_request:
    paths:
      - docs/protocol.md
      - docs/airscan.md
      - docs/disclaimer.md
      - CHANGELOG.md
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.147.9
  UV_PYTHON: "3.14"
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Qt system libraries and font
        run: >
          sudo apt-get update -q && sudo apt-get install -y -q
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-inter
      - name: App screenshots
        run: uv run --extra app python tools/screenshots.py
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/release.json"; then
            mv "$RUNNER_TEMP/release.json" site/data/release.json
            jq -r '"Release: \(.tag_name), \(.assets | length) files"' site/data/release.json
          else
            echo "No release yet: the page only links to the releases overview."
          fi
      - name: Install Hugo
        run: |
          curl -sSL -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}" hugo
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: >
          "${RUNNER_TEMP}/hugo" --source site --minify --panicOnWarning
          --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
