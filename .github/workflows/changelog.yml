# Pull requests that change the app (src/, packaging/, ios/src/) must add to CHANGELOG.md under "Unreleased"
# (CLAUDE.md). For changes that do not matter to users (refactoring, tests), set the label
# "no changelog"; the check runs again when the label is set.
name: Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: App changed → CHANGELOG.md updated?
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD")
          app=$(echo "$changed" | grep -E '^(src/|packaging/|ios/src/)' || true)
          if [ -z "$app" ]; then
            echo "No change to the app."
          elif echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md is updated."
          else
            echo "::error file=CHANGELOG.md::The app changes, but CHANGELOG.md does not. Add an entry under [Unreleased] or set the label 'no changelog'."
            echo "$app"
            exit 1
          fi
