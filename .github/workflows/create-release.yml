# Start manually (Actions → Create Release → Run workflow): checks main, bumps the version
# (major/minor/patch, tools/bump_version.py), turns "Unreleased" in CHANGELOG.md into the new version,
# commits, pushes tag vX.Y.Z and builds the release (notes from CHANGELOG.md).
name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment (major.minor.patch)
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    env:
      UV_PYTHON: "3.14"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Start Create Release on main only (not ${{ github.ref_name }})"
          exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Qt system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: tools/check.sh
      - name: Bump version
        id: bump
        run: |
          VERSION=$(uv run --no-sync python tools/bump_version.py "${{ inputs.bump }}")
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### ScanSnack $VERSION (${{ inputs.bump }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Push commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version ${TAG#v}"
          git tag -a "$TAG" -m "ScanSnack ${TAG#v}"
          git push --atomic origin HEAD:main "$TAG"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
      actions: write
