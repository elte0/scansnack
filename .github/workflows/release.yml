# Baut die Desktop-App für macOS (arm64 + Intel), Windows und Linux und hängt sie an ein GitHub-Release.
# Auslöser: ein Tag vX.Y.Z (von Hand gepusht) oder der Workflow „Create Release“ (ruft diesen auf;
# Tags, die ein Workflow mit GITHUB_TOKEN pusht, lösen selbst keine Workflows aus).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  UV_PYTHON: "3.14"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
          - { os: ubuntu-22.04, target: linux-x86_64 }    # ältere glibc → läuft auf mehr Distributionen
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v7
      - name: Tag passt zur Version in pyproject.toml
        if: env.TAG != ''
        run: |
          VERSION=$(uv version --short)
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG passt nicht zu Version $VERSION"; exit 1; }
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv run --extra app python tools/build_app.py
      - uses: actions/upload-artifact@v6
        with:
          name: ScanSnack-${{ matrix.target }}
          path: dist/ScanSnack-*
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ScanSnack ${TAG#v}" --generate-notes --notes "$(cat <<'NOTES'
          ## Downloads

          | System | Datei |
          |---|---|
          | macOS (Apple Silicon) | `ScanSnack-*-macos-arm64.dmg` |
          | macOS (Intel) | `ScanSnack-*-macos-x86_64.dmg` |
          | Windows 10/11 (64 Bit) | `ScanSnack-*-windows-x86_64.zip` |
          | Linux (x86_64) | `ScanSnack-*-linux-x86_64.tar.gz` |

          Die Builds sind nicht von Apple bzw. Microsoft signiert:

          - **macOS:** DMG öffnen, ScanSnack nach „Programme“ ziehen. Beim ersten Start blockiert macOS die App;
            unter Systemeinstellungen → Datenschutz & Sicherheit „Dennoch öffnen“ wählen
            (oder `xattr -dr com.apple.quarantine /Applications/ScanSnack.app`).
          - **Windows:** ZIP entpacken, `ScanSnack\ScanSnack.exe` starten; bei SmartScreen „Weitere Informationen“ → „Trotzdem ausführen“.
          - **Linux:** entpacken, `ScanSnack/ScanSnack` starten. Braucht die üblichen Qt-Systembibliotheken
            (z. B. `libxcb-cursor0`, `libegl1`). Menüeintrag: `scansnack.desktop` und `scansnack.png` liegen bei.
          NOTES
          )"
