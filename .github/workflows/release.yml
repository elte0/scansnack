# Baut die Desktop-App für macOS (arm64 + Intel), Windows und Linux und hängt sie an ein GitHub-Release.
# Auslöser: ein Tag vX.Y.Z (von Hand gepusht) oder der Workflow „Create Release“ (ruft diesen auf;
# Tags, die ein Workflow mit GITHUB_TOKEN pusht, lösen selbst keine Workflows aus).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write
  actions: write   # Website neu bauen (Download-Links)

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
  UV_PYTHON: "3.14"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
          - { os: ubuntu-22.04, target: linux-x86_64 }    # ältere glibc → läuft auf mehr Distributionen
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v7
      - name: Tag passt zur Version in pyproject.toml
        if: env.TAG != ''
        run: |
          VERSION=$(uv version --short)
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag $TAG passt nicht zu Version $VERSION"; exit 1; }
      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv run --extra app python tools/build_app.py
      - uses: actions/upload-artifact@v6
        with:
          name: ScanSnack-${{ matrix.target }}
          path: dist/ScanSnack-*
          if-no-files-found: error

  release:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Prüfsummen für die Update-Prüfung der App (zusätzlich zu GitHubs eigenem digest pro Asset)
      - name: SHA256SUMS
        run: cd dist && sha256sum ScanSnack-* > SHA256SUMS && cat SHA256SUMS
      # Release-Notes: Abschnitt der Version aus CHANGELOG.md (von Create Release angelegt);
      # fehlt er (Tag von Hand ohne Changelog), erzeugt GitHub die Notes aus den Pull Requests.
      - name: Release-Notes aus CHANGELOG.md
        run: |
          if python3 tools/changelog.py notes "${TAG#v}" > "$RUNNER_TEMP/notes.md"; then
            echo "GENERATE=" >> "$GITHUB_ENV"
            printf '\nAll changes: [CHANGELOG.md](%s/blob/%s/CHANGELOG.md)\n\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$TAG" >> "$RUNNER_TEMP/notes.md"
          else
            echo "::warning::Kein Abschnitt ${TAG#v} in CHANGELOG.md, Notes werden aus den Pull Requests erzeugt"
            : > "$RUNNER_TEMP/notes.md"
            echo "GENERATE=--generate-notes" >> "$GITHUB_ENV"
          fi
          cat >> "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Downloads

          | System | File |
          |---|---|
          | macOS (Apple Silicon) | `ScanSnack-*-macos-arm64.dmg` |
          | macOS (Intel) | `ScanSnack-*-macos-x86_64.dmg` |
          | Windows 10/11 (64-bit) | `ScanSnack-*-windows-x86_64.zip` |
          | Linux (x86_64) | `ScanSnack-*-linux-x86_64.tar.gz` |

          The builds are not signed by Apple or Microsoft:

          - **macOS:** open the DMG and drag ScanSnack to Applications. macOS blocks the first launch;
            choose "Open Anyway" under System Settings → Privacy & Security
            (or run `xattr -dr com.apple.quarantine /Applications/ScanSnack.app`).
          - **Windows:** unzip and start `ScanSnack\ScanSnack.exe`; at the SmartScreen prompt choose "More info" → "Run anyway".
          - **Linux:** unpack and start `ScanSnack/ScanSnack`. Needs the usual Qt system libraries
            (e.g. `libxcb-cursor0`, `libegl1`). `scansnack.desktop` and `scansnack.png` are included for a menu entry.

          Unofficial project, not affiliated with PFU or Fujitsu. See the [disclaimer](https://github.com/elte0/scansnack/blob/main/docs/disclaimer.md).
          NOTES
          cat "$RUNNER_TEMP/notes.md"
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # shellcheck disable=SC2086  # $GENERATE ist leer oder genau eine Option
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "ScanSnack ${TAG#v}" $GENERATE --notes-file "$RUNNER_TEMP/notes.md"
      - name: Website mit den neuen Download-Links bauen
        env:
          GH_TOKEN: ${{ github.token }}
        # auf main, nicht auf dem Tag: die Umgebung github-pages erlaubt nur main
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
