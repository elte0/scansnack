# Hugo site: app presentation, protocol docs, changelog. Content comes from docs/ and CHANGELOG.md (the only
# source), see mounts.
baseURL = "https://elte0.github.io/scansnack/"
languageCode = "en"
title = "ScanSnack"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "section"]
enableRobotsTXT = false

[params]
  repo = "https://github.com/elte0/scansnack"
  description = "ScanSnack: scan with a ScanSnap iX1500 over Wi-Fi without ScanSnap Home, and an independent write-up of its protocol."

[markup.goldmark.renderHooks.link]
  # Rewrite .md links from docs/ to the pages of the website
  enableDefault = true

[markup.goldmark.parser]
  autoHeadingIDType = "github"

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = false

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../docs"
    target = "content"
    includeFiles = ["protocol.md", "airscan.md", "disclaimer.md"]
  [[module.mounts]]
    source = "../CHANGELOG.md"
    target = "content/changelog.md"
