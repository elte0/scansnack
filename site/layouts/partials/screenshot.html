{{- /* Screenshot of the app (light + dark), generated by tools/screenshots.py. If the image is missing (local build
     without the script), the figure is left out. */ -}}
{{- $base := printf "screenshots/%s" .name -}}
{{- if fileExists (printf "static/%s-light.png" $base) }}
<figure class="shot{{ with .class }} {{ . }}{{ end }}">
  <picture>
    <source srcset="{{ printf "%s-dark.png" $base | relURL }}" media="(prefers-color-scheme: dark)">
    <img src="{{ printf "%s-light.png" $base | relURL }}" alt="{{ .alt }}" loading="lazy">
  </picture>
  {{- with .caption }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
{{- end }}
